<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid Example</title>
    <link rel="stylesheet" href="style9.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Our Featured Products</h1>

    <div class="grid">
        <div class="card">
            <a href="#">
                <img src="https://m.media-amazon.com/images/I/411ZvaG2vhL._SY300_SX300_QL70_FMwebp_.jpg" alt="Product 1">
                <h3>Product 1</h3>
            </a>
            <p>High quality item with great features.</p>
            <div class="price">₹1,200</div>
        </div>

        <div class="card">
            <a href="#">
                <img src="https://m.media-amazon.com/images/I/41EJryxe1WL._SY300_SX300_QL70_FMwebp_.jpg" alt="Product 2">
                <h3>Product 2</h3>
            </a>
            <p>Durable and stylish for daily use.</p>
            <div class="price">₹750</div>
        </div>

        <div class="card">
            <a href="#">
                <img src="https://images-eu.ssl-images-amazon.com/images/I/61HNBOQ-P9L._AC_UL450_SR450,320_.jpg" alt="Product 3">
                <h3>Product 3</h3>
            </a>
            <p>Soft, premium, and comfortable.</p>
            <div class="price">₹1,200</div>
        </div>

        <div class="card">
            <a href="#">
                <img src="https://rukminim2.flixcart.com/image/240/240/xif0q/point-shoot-camera/c/i/s/4k-video-compact-cameras-with-16x-digital-zoom-anti-shake-2-original-imahgpuhpgzamna2.jpeg?q=60">
                <h3>Product 4</h3>
            </a>
            <p>Sleek design with premium quality.</p>
            <div class="price">₹1,599</div>
        </div>
    </div>

</body>
</html>
